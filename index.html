<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找貓</title>
<style>
  :root {
    --bg: #f7efe9;
    --card: #ffffff;
    --text: #8a5a5a;
    --muted: #b58f8f;
    --accent: #e05a5a;
    --ok: #2f9a5a;
    --tile-gap: 6px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  body { padding: 12px 16px 32px; max-width: 520px; margin: 0 auto; user-select: none; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header .stat { text-align: center; }
  header .stat .label { font-size: 15px; font-weight: 600; }
  header .stat .value { font-size: 30px; font-weight: 700; line-height: 1.05; }
  header .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .iconbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--card);
    color: var(--text); font-size: 22px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.06); }

  .lives { background: var(--card); border-radius: 18px; padding: 8px 14px; display: flex; gap: 8px;
    justify-content: center; margin-bottom: 12px; font-size: 22px; }
  .lives span { filter: grayscale(1); opacity: .35; }
  .lives span.lost { filter: none; opacity: 1; }

  .rules { background: var(--card); border-radius: 18px; padding: 10px; display: flex; gap: 8px; margin-bottom: 12px; }
  .rule { flex: 1; background: #fbf3ee; border-radius: 12px; padding: 8px 6px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; line-height: 1.25; }
  .rule .mini { display: grid; grid-template-columns: repeat(3, 10px); gap: 1px; flex: none; }
  .rule .mini i { width: 10px; height: 10px; border-radius: 2px; background: #e6d6cd; display: block;
    font-style: normal; font-size: 8px; line-height: 10px; text-align: center; color: #8a5a5a; }
  .rule .mini i.c { background: #f3e2d9; }

  .boardwrap { background: var(--card); border-radius: 18px; padding: 12px; }
  .board { display: grid; gap: var(--tile-gap); width: 100%; aspect-ratio: 1; touch-action: none; }
  .cell { border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center;
    min-width: 0; min-height: 0; overflow: hidden; cursor: pointer; font-size: clamp(14px, 5vw, 30px); line-height: 1; transition: transform .08s; }
  .cell:active { transform: scale(.93); }
  .cell .mark { pointer-events: none; }
  /* 叉叉：用兩條斜線畫，佔方框 90%，隨格子大小縮放 */
  /* 叉叉縮在方框中央（約佔 55%），四周留出色塊 */
  .cell .mark.x { position: absolute; inset: 22%; color: #fff; }
  .cell .mark.x::before, .cell .mark.x::after { content: ""; position: absolute; left: 50%; top: -12%;
    width: 22%; height: 124%; background: currentColor; border-radius: 999px;
    transform: translateX(-50%) rotate(45deg); }
  .cell .mark.x::after { transform: translateX(-50%) rotate(-45deg); }
  .cell .mark.x.auto { opacity: 1; }
  /* 貓：SVG 剪影填上原本方框的顏色；放貓後方框改為白底、保留同色粗邊框，格子仍完整 */
  .cell.hascat { background: var(--card) !important; box-shadow: inset 0 0 0 3px var(--tile); }
  .cell .mark.cat { position: absolute; inset: 6%; }
  .cell .mark.cat svg { width: 100%; height: 100%; display: block; }
  /* 貓的眼珠左右轉、偶爾眨眼 */
  .cat .pupils { transform-box: fill-box; transform-origin: center; animation: look 5s ease-in-out infinite; }
  .cat .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out infinite; }
  @keyframes look {
    0%, 18% { transform: translateX(0); }
    26%, 44% { transform: translateX(-3px); }
    52%, 70% { transform: translateX(3px); }
    78%, 100% { transform: translateX(0); }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.12); }
  }
  .cell.locked { cursor: default; }
  .cell.wrong { box-shadow: inset 0 0 0 3px var(--accent); }
  .cell.wrong .mark { animation: shake .3s; }
  /* 放錯：白叉加紅邊，任何底色上都看得見 */
  .cell.wrong .mark.x::before, .cell.wrong .mark.x::after { box-shadow: 0 0 0 2.5px var(--accent); }
  @keyframes shake { 25% { transform: translateX(-3px);} 75% { transform: translateX(3px);} }
  .board.won .cell { cursor: default; }

  .controls { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 12px 8px; font-size: 16px; font-weight: 600;
    background: var(--card); color: var(--text); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .btn.primary { background: var(--text); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }

  .status { text-align: center; margin-top: 12px; min-height: 24px; font-size: 15px; }
  .status.win { color: var(--ok); font-weight: 700; font-size: 18px; }
  .status.lose { color: var(--accent); font-weight: 700; font-size: 18px; }

  .settings { margin-top: 14px; background: var(--card); border-radius: 18px; padding: 12px 14px; font-size: 14px; }
  .settings[hidden] { display: none; }
  .settings label { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; gap: 10px; }
  .settings input[type=number] { width: 80px; font-size: 16px; padding: 4px 8px; border: 1px solid #e6d6cd; border-radius: 8px; }
  .settings .row { display: flex; gap: 8px; align-items: center; }
  .settings .small { color: var(--muted); font-size: 12px; }

  .player { text-align: center; font-size: 14px; color: var(--muted); margin: -6px 0 10px; }
  .player b { color: var(--text); }

  .modal { position: fixed; inset: 0; background: rgba(60,30,30,.35); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 20; }
  .modal[hidden] { display: none; }
  .sheet { background: var(--card); border-radius: 20px; padding: 18px 16px; width: 100%; max-width: 420px;
    max-height: 85vh; overflow: auto; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; text-align: center; }
  .sheet .hint { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .addrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .addrow input { flex: 1; font-size: 16px; padding: 10px 12px; border: 1px solid #e6d6cd; border-radius: 12px; min-width: 0; }
  .ranks { width: 100%; border-collapse: collapse; font-size: 15px; }
  .ranks th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px; }
  .ranks td { padding: 8px 6px; border-top: 1px solid #f3e7e0; }
  .ranks tr.me td { background: #fbf3ee; font-weight: 700; }
  .ranks td.num { text-align: right; white-space: nowrap; }
  .ranks tr[data-name] { cursor: pointer; }
  .ranks .del { border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 6px; }
  .sheet .close { margin-top: 12px; width: 100%; }
  .scorebox { text-align: center; margin: 6px 0 0; font-size: 14px; color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: rgba(247,239,233,.85); display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-weight: 700; z-index: 10; }
  .overlay[hidden] { display: none; }
</style>
</head>

<header>
  <button class="iconbtn" id="btnPrev" title="上一關">←</button>

  <div class="rule"><div class="mini"><i>×</i><i class="c">🐱</i><i>×</i><i>×</i><i>×</i><i>×</i><i>×</i><i>×</i><i>×</i></div>每行每列各一隻貓</div>

<div class="settings" id="settings" hidden>
  <label><span>跳到關卡</span>
    <span class="row"><input type="number" id="gotoLevel" min="1" max="9999" value="1"><button class="btn" id="btnGoto" style="flex:none;padding:6px 12px">前往</button></span>
  </label>

    <span class="row">
      <select id="meowPick" style="font-size:15px;padding:6px 8px;border:1px solid #e6d6cd;border-radius:8px">
        <option value="0">貓叫 1（短促，0.6 秒）</option>

      </select>

<div class="overlay" id="overlay" hidden>產生關卡中…</div>

<script>
/* ---------------- 關卡產生器 ---------------- */

// 固定種子的亂數：同一關永遠產生同一題
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffled(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 1. 先隨機擺出一組合法的貓位置（每行每列一隻、互不相鄰）
function randomPlacement(n, rng) {
  const cols = new Array(n).fill(-1);
  const used = new Set();
  function go(r) {
    if (r === n) return true;
    for (const c of shuffled([...Array(n).keys()], rng)) {
      if (used.has(c)) continue;
      if (r > 0 && Math.abs(cols[r - 1] - c) <= 1) continue;
      cols[r] = c; used.add(c);
      if (go(r + 1)) return true;
      used.delete(c);
    }
    return false;
  }
  go(0);
  return cols; // cols[r] = 該列貓所在的欄
}

// 2. 以每隻貓為種子，用加權隨機洪水填充長出 n 個顏色區域
function growRegions(n, cats, rng) {
  const region = Array.from({ length: n }, () => new Array(n).fill(-1));
  const cells = [];   // cells[k] = 區域 k 目前擁有的格子
  const weight = [];  // 擴張權重：權重差異大 → 有大區也有小區
  for (let k = 0; k < n; k++) {
    region[k][cats[k]] = k;
    cells.push([[k, cats[k]]]);
    weight.push(0.2 + Math.pow(rng(), 2) * 3);
  }
  let empty = n * n - n;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (empty > 0) {
    const total = weight.reduce((s, w) => s + w, 0);
    if (total <= 0) break;
    let pick = rng() * total, k = 0;
    while (k < n - 1 && pick >= weight[k]) { pick -= weight[k]; k++; }
    // 找出區域 k 所有可擴張的空鄰格
    const frontier = [];
    for (const [r, c] of cells[k]) for (const [dr, dc] of dirs) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < n && cc >= 0 && cc < n && region[rr][cc] === -1) frontier.push([rr, cc]);
    }
    if (frontier.length === 0) { weight[k] = 0; continue; }
    const [r, c] = frontier[Math.floor(rng() * frontier.length)];
    region[r][c] = k; cells[k].push([r, c]); empty--;
  }
  return region;
}

// 3. 解題器：回溯法，最多找 limit 組解，回傳每組解的欄位陣列（用來確認唯一解）
function solve(region, limit) {
  const n = region.length;
  const usedCol = new Array(n).fill(false), usedReg = new Array(n).fill(false);
  const cols = [], found = [];
  function go(r) {
    if (r === n) { found.push(cols.slice()); return found.length >= limit; }
    for (let c = 0; c < n; c++) {
      const k = region[r][c];
      if (usedCol[c] || usedReg[k]) continue;
      if (r > 0 && Math.abs(cols[r - 1] - c) <= 1) continue;
      usedCol[c] = usedReg[k] = true; cols.push(c);
      if (go(r + 1)) return true;
      cols.pop(); usedCol[c] = usedReg[k] = false;
    }
    return false;
  }
  go(0);
  return found;
}
function countSolutions(region, limit) { return solve(region, limit).length; }

// 拿掉 (r, c) 之後，區域 k 是否仍然連通
function stillConnected(region, k, r, c) {
  const n = region.length;
  let start = null, total = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    if (region[i][j] === k && !(i === r && j === c)) { total++; if (!start) start = [i, j]; }
  if (!start) return false;
  const seen = new Set([start[0] * n + start[1]]), stack = [start];
  while (stack.length) {
    const [i, j] = stack.pop();
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ii = i + di, jj = j + dj;
      if (ii < 0 || ii >= n || jj < 0 || jj >= n) continue;
      if (ii === r && jj === c) continue;
      const key = ii * n + jj;
      if (region[ii][jj] === k && !seen.has(key)) { seen.add(key); stack.push([ii, jj]); }
    }
  }
  return seen.size === total;
}

// 4. 修補：只要有第二組解，就把那組解多出來的貓所在格改成鄰近顏色。
//    該格不是正解的貓格，所以正解仍成立；而第二組解在新顏色裡會有兩隻貓，因此失效。
function repairToUnique(region, cats, rng, maxSteps) {
  const n = region.length;
  for (let step = 0; step < maxSteps; step++) {
    const sols = solve(region, 2);
    if (sols.length === 1) return true;
    const alt = sols[0].every((c, r) => c === cats[r]) ? sols[1] : sols[0];
    const rows = shuffled([...Array(n).keys()].filter(r => alt[r] !== cats[r]), rng);
    let changed = false;
    for (const r of rows) {
      const c = alt[r], k = region[r][c];
      const options = [];
      for (const [dr, dc] of shuffled([[1, 0], [-1, 0], [0, 1], [0, -1]], rng)) {
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || rr >= n || cc < 0 || cc >= n) continue;
        const k2 = region[rr][cc];
        if (k2 !== k && !options.includes(k2)) options.push(k2);
      }
      if (options.length && stillConnected(region, k, r, c)) {
        region[r][c] = options[0]; changed = true; break;
      }
    }
    if (!changed) return false;
  }
  return solve(region, 2).length === 1;
}

/* ---------------- 難度評分：模擬人類推理 ----------------
   技巧分級：
   1 簡單：T1 某行/列/區只剩一個候選格 → 放貓；T2 某區候選格全在同一行(列) → 鎖住該行(列)
   2 中等：T3 放此格會讓某行/列/區沒位置 → 排除；T4 k 個區域剛好佔 k 行(列) → 其他區域讓開
   3 困難：T5 假設放此格，用簡單技巧推下去會矛盾 → 排除
   4 無法純邏輯推完（需要猜測），產生器不採用 */
function rateDifficulty(region) {
  const n = region.length;
  const cand = Array.from({ length: n }, () => new Array(n).fill(true));
  const rowCat = new Array(n).fill(false), colCat = new Array(n).fill(false), regCat = new Array(n).fill(false);
  let placed = 0, tier = 1;
  const catAt = new Array(n).fill(-1);

  const cellsOf = { row: r => [...Array(n).keys()].map(c => [r, c]),
                    col: c => [...Array(n).keys()].map(r => [r, c]) };
  const regCells = Array.from({ length: n }, () => []);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) regCells[region[r][c]].push([r, c]);

  function place(r, c) {
    for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++)
      if (rr === r || cc === c || region[rr][cc] === region[r][c] || (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1)) cand[rr][cc] = false;
    rowCat[r] = colCat[c] = regCat[region[r][c]] = true; placed++; catAt[r] = c;
  }
  const candsIn = cells => cells.filter(([r, c]) => cand[r][c]);
  const units = () => {
    const u = [];
    for (let i = 0; i < n; i++) {
      if (!rowCat[i]) u.push(candsIn(cellsOf.row(i)));
      if (!colCat[i]) u.push(candsIn(cellsOf.col(i)));
      if (!regCat[i]) u.push(candsIn(regCells[i]));
    }
    return u;
  };
  const contradiction = () => units().some(cs => cs.length === 0);

  // T1
  function t1() {
    for (const cs of units()) if (cs.length === 1) { place(...cs[0]); return true; }
    return false;
  }
  // T2：區域候選格全在同一行/列，或某行/列候選格全在同一區域
  function t2() {
    let changed = false;
    for (let k = 0; k < n; k++) {
      if (regCat[k]) continue;
      const cs = candsIn(regCells[k]);
      const rows = new Set(cs.map(x => x[0])), cols = new Set(cs.map(x => x[1]));
      if (rows.size === 1) { const [r] = rows; for (let c = 0; c < n; c++) if (cand[r][c] && region[r][c] !== k) { cand[r][c] = false; changed = true; } }
      if (cols.size === 1) { const [c] = cols; for (let r = 0; r < n; r++) if (cand[r][c] && region[r][c] !== k) { cand[r][c] = false; changed = true; } }
    }
    for (let i = 0; i < n; i++) {
      for (const [line, isRow] of [[cellsOf.row(i), true], [cellsOf.col(i), false]]) {
        if (isRow ? rowCat[i] : colCat[i]) continue;
        const cs = candsIn(line);
        const regs = new Set(cs.map(([r, c]) => region[r][c]));
        if (regs.size === 1) { const [k] = regs;
          for (const [r, c] of regCells[k]) if (cand[r][c] && (isRow ? r !== i : c !== i)) { cand[r][c] = false; changed = true; } }
      }
    }
    return changed;
  }
  // T3：放這格會讓某個單位沒有位置
  function t3() {
    let changed = false;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!cand[r][c]) continue;
      const kills = (rr, cc) => rr === r || cc === c || region[rr][cc] === region[r][c] || (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1);
      for (const cs of units()) {
        if (cs.some(([rr, cc]) => rr === r && cc === c)) continue; // 這格自己所屬的單位由它滿足
        if (cs.every(([rr, cc]) => kills(rr, cc))) { cand[r][c] = false; changed = true; break; }
      }
    }
    return changed;
  }
  // T4：k 個區域的候選格剛好只佔 k 行(列) → 這些行(列)被它們包辦
  function t4() {
    let changed = false;
    const free = [...Array(n).keys()].filter(k => !regCat[k]);
    const lineSets = free.map(k => { const cs = candsIn(regCells[k]);
      return { k, rows: new Set(cs.map(x => x[0])), cols: new Set(cs.map(x => x[1])) }; });
    for (const size of [2, 3]) {
      const combos = [];
      const go = (start, acc) => { if (acc.length === size) { combos.push(acc.slice()); return; }
        for (let i = start; i < lineSets.length; i++) { acc.push(lineSets[i]); go(i + 1, acc); acc.pop(); } };
      go(0, []);
      for (const combo of combos) for (const dim of ["rows", "cols"]) {
        const union = new Set(); combo.forEach(x => x[dim].forEach(v => union.add(v)));
        if (union.size !== size) continue;
        const ks = new Set(combo.map(x => x.k));
        for (const line of union) for (let j = 0; j < n; j++) {
          const [r, c] = dim === "rows" ? [line, j] : [j, line];
          if (cand[r][c] && !ks.has(region[r][c])) { cand[r][c] = false; changed = true; }
        }
      }
    }
    return changed;
  }
  // T5：假設放此格，用 T1+T2 推到底若矛盾 → 排除
  function t5() {
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!cand[r][c]) continue;
      const snap = { cand: cand.map(x => x.slice()), rowCat: rowCat.slice(), colCat: colCat.slice(), regCat: regCat.slice(), placed, catAt: catAt.slice() };
      place(r, c);
      let bad = contradiction();
      while (!bad && placed < n) {
        if (t1() || t2()) { bad = contradiction(); continue; }
        break;
      }
      for (let i = 0; i < n; i++) { cand[i] = snap.cand[i]; rowCat[i] = snap.rowCat[i]; colCat[i] = snap.colCat[i]; regCat[i] = snap.regCat[i]; }
      placed = snap.placed; for (let i = 0; i < n; i++) catAt[i] = snap.catAt[i];
      if (bad) { cand[r][c] = false; return true; }
    }
    return false;
  }

  while (placed < n) {
    if (contradiction()) return { tier: 4, solved: false };
    if (t1() || t2()) continue;
    if (t3() || t4()) { tier = Math.max(tier, 2); continue; }
    if (t5()) { tier = Math.max(tier, 3); continue; }
    return { tier: 4, solved: false };
  }
  return { tier, solved: true, cats: catAt };
}

// 關卡 → 盤面大小
function sizeForLevel(level) {
  if (level <= 5) return 6;
  if (level <= 10) return 7;
  if (level <= 20) return 8;
  if (level <= 30) return 9;
  return 10;
}
// 關卡 → 難度：1 到 10 關簡單、11 到 30 關中等、之後困難
function tierForLevel(level) { return level <= 10 ? 1 : level <= 30 ? 2 : 3; }
const TIER_NAME = { 1: "簡單", 2: "中等", 3: "困難" };

// 產生第 level 關：隨機擺貓 → 長區域 → 修補到唯一解 → 難度符合要求才採用
function generateLevel(level) {
  const n = sizeForLevel(level), want = tierForLevel(level);
  const rng = mulberry32(level * 7919 + n * 104729 + 12345);
  for (let attempt = 0; attempt < 3000; attempt++) {
    const cats = randomPlacement(n, rng);
    const region = growRegions(n, cats, rng);
    if (!repairToUnique(region, cats, rng, 60)) continue;
    const rating = rateDifficulty(region);
    if (rating.tier !== want) continue;
    return { n, region, solution: cats, colors: assignColors(region), tier: want, attempts: attempt + 1 };
  }
  throw new Error("找不到符合難度的題目");
}

/* ---------------- 遊戲狀態與畫面 ---------------- */

// 10 個色相各不相同的顏色：紅、橙、黃、草綠、深綠、青、藍、紫、粉紅、棕
// 亮度與飽和度略降，減少眼睛疲勞；色相仍各不相同
const PALETTE = ["#a6352f", "#c2561c", "#a88f14", "#508922", "#1b5b34",
                 "#1a7b83", "#2455b8", "#6b34a8", "#c33684", "#5b3d24"];

function hexToRgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function colorDist(a, b) {
  const [r1, g1, b1] = hexToRgb(a), [r2, g2, b2] = hexToRgb(b);
  // 加權 RGB 距離，接近人眼感受
  return Math.sqrt(2 * (r1 - r2) ** 2 + 4 * (g1 - g2) ** 2 + 3 * (b1 - b2) ** 2);
}

// 幫每個區域挑顏色：相鄰區域的顏色差異要盡量大
function assignColors(region) {
  const n = region.length;
  const adj = Array.from({ length: n }, () => new Set());
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const k = region[r][c];
    for (const [rr, cc] of [[r + 1, c], [r, c + 1], [r + 1, c + 1], [r + 1, c - 1]]) {
      if (rr < 0 || rr >= n || cc < 0 || cc >= n) continue;
      const k2 = region[rr][cc];
      if (k2 !== k) { adj[k].add(k2); adj[k2].add(k); }
    }
  }
  // 第一步：貪婪法，鄰居最多的區域先挑
  const order = [...Array(n).keys()].sort((a, b) => adj[b].size - adj[a].size);
  const color = new Array(n).fill(null), used = new Set();
  for (const k of order) {
    let best = null, bestScore = -1;
    for (const col of PALETTE) {
      if (used.has(col)) continue;
      let score = Infinity;
      for (const k2 of adj[k]) if (color[k2]) score = Math.min(score, colorDist(col, color[k2]));
      if (score > bestScore) { bestScore = score; best = col; }
    }
    color[k] = best; used.add(best);
  }
  // 第二步：兩兩交換顏色，只要相鄰區域的最小色差變大就接受
  const worst = () => {
    let m = Infinity;
    for (let k = 0; k < n; k++) for (const k2 of adj[k]) m = Math.min(m, colorDist(color[k], color[k2]));
    return m;
  };
  let improved = true, cur = worst();
  while (improved) {
    improved = false;
    for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
      [color[a], color[b]] = [color[b], color[a]];
      const w = worst();
      if (w > cur) { cur = w; improved = true; }
      else [color[a], color[b]] = [color[b], color[a]];
    }
  }
  return color;
}

const EMPTY = 0, MARK_X = 1, CAT = 2, WRONG = 3;   // CAT 與 WRONG 放下後就鎖定

function loadStore() {

/* ---------------- 音效（Web Audio 合成，不需要音檔） ---------------- */
let audioCtx = null;
function audio() {
  if (!$("sound").checked) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    loadMeows(audioCtx);
    return audioCtx;
  } catch { return null; }
}
// 真實貓叫聲（CC0，見 sounds/LICENSE.txt）：第一次啟用聲音時載入
const MEOW_FILES = ["sounds/meow1.wav", "sounds/meow2.wav", "sounds/meow3.wav", "sounds/meow4.wav"];
let meowBuffers = [], meowLoading = false, lastMeowDur = 0.6;
async function loadMeows(ctx) {
  if (meowLoading) return; meowLoading = true;
  const list = await Promise.all(MEOW_FILES.map(async f => {
    try { const r = await fetch(f); return await ctx.decodeAudioData(await r.arrayBuffer()); } catch { return null; }
  }));
  meowBuffers = list;
}
function chosenMeow() { return meowBuffers[+$("meowPick").value] || null; }
// 播放選定的貓叫，回傳長度（秒）；音檔還沒載好就用合成喵
function playMeow(c) {
  const b = chosenMeow();
  if (!b) { sfx.meow(); return 0.6; }
  const src = c.createBufferSource(), g = c.createGain();
  src.buffer = b; g.gain.value = 0.9; src.connect(g); g.connect(c.destination); src.start();
  return b.duration;
}
function tone(ctx, { type = "sine", freq = 440, to = null, dur = 0.1, vol = 0.2, at = 0, lowpass = null }) {
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime + at);
  if (to) osc.frequency.exponentialRampToValueAtTime(to, ctx.currentTime + at + dur);
  g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
  g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + dur);
  let node = osc;
  if (lowpass) { const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lowpass; osc.connect(f); node = f; }
  node.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime + at); osc.stop(ctx.currentTime + at + dur + 0.05);
}
// 語音：用瀏覽器內建的語音合成唸中文稱讚，不需要音檔
const PRAISE = ["太棒了", "很好", "好厲害", "答對了", "太厲害了", "找到了"];
let voicesReady = [];
if ("speechSynthesis" in window) {
  const load = () => { voicesReady = speechSynthesis.getVoices(); };
  load(); speechSynthesis.addEventListener("voiceschanged", load);
}
function speak(text) {
  if (!$("sound").checked || !("speechSynthesis" in window)) return false;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW"; u.rate = 1.0; u.pitch = 1.1; u.volume = 1;
    // 優先台灣國語，其次任何中文語音
    const zh = voicesReady.filter(v => v.lang && /^zh[-_]?(TW|HK|CN)?/i.test(v.lang));
    const v = zh.find(v => /TW/i.test(v.lang)) || zh.find(v => /Mei-Jia|Meijia|Google 國語|Hanhan|Yating/i.test(v.name)) || zh[0];
    if (v) u.voice = v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return true;
  } catch { return false; }
}

const sfx = {
  // 找到貓：先播真實貓叫，叫完再唸一句稱讚（過關那一隻不唸，讓位給過關旋律）
  found(isWin) {
    const c = audio();
    lastMeowDur = c ? playMeow(c) : 0.6;
    if (!isWin) setTimeout(() => speak(PRAISE[Math.floor(Math.random() * PRAISE.length)]), lastMeowDur * 1000 + 60);
  },
  click() { const c = audio(); if (c) tone(c, { type: "triangle", freq: 900, to: 500, dur: 0.06, vol: 0.15 }); },
  meow() {
    const c = audio(); if (!c) return;
    // 喵：鋸齒波做基音，加顫音，音高先上揚再下滑
    const osc = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter(), lfo = c.createOscillator(), lg = c.createGain();
    const t = c.currentTime;
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(880, t + 0.12);
    osc.frequency.exponentialRampToValueAtTime(700, t + 0.3);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.55);
    lfo.frequency.value = 22; lg.gain.value = 18; lfo.connect(lg); lg.connect(osc.frequency);
    f.type = "lowpass"; f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(900, t + 0.55); f.Q.value = 4;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.05);
    g.gain.setValueAtTime(0.28, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.58);
    osc.connect(f); f.connect(g); g.connect(c.destination);
    osc.start(t); lfo.start(t); osc.stop(t + 0.6); lfo.stop(t + 0.6);
  },
  // 放錯：兩聲下降的「嘟嘟」，音高夠高手機喇叭才聽得到
  wrong() { const c = audio(); if (c) { tone(c, { type: "square", freq: 420, to: 300, dur: 0.14, vol: 0.22, lowpass: 2500 });
                                       tone(c, { type: "square", freq: 300, to: 200, dur: 0.22, vol: 0.22, at: 0.16, lowpass: 2500 }); } },
  // 過關：等喵（約 0.6 秒）播完再開始，約 1.6 秒的上行旋律，最後一個音拉長
  win() {
    const c = audio(); if (!c) return;
    const start = lastMeowDur + 0.15;
    const notes = [[523, 0, 0.16], [659, 0.15, 0.16], [784, 0.30, 0.16], [1047, 0.45, 0.22],
                   [784, 0.70, 0.14], [1047, 0.84, 0.14], [1319, 0.98, 0.6]];
    notes.forEach(([f, at, dur]) => tone(c, { freq: f, dur, vol: 0.2, at: start + at }));
    notes.forEach(([f, at, dur]) => tone(c, { type: "triangle", freq: f / 2, dur, vol: 0.08, at: start + at }));
  },
  lose() { const c = audio(); if (c) [392, 330, 262].forEach((f, i) => tone(c, { type: "triangle", freq: f, dur: 0.25, vol: 0.15, at: i * 0.2 })); },
};

/* ---------------- 參賽者與積分 ---------------- */
const BASE_SCORE = { 1: 100, 2: 200, 3: 300 };
function calcScore(tier, mistakes, ms) {
  const bonus = Math.round(50 * Math.max(0, 60000 - ms) / 60000);   // 1 分鐘內完成，越快加越多
  return Math.max(0, BASE_SCORE[tier] - 20 * mistakes + bonus);
}
function currentPlayer() { return store.current && store.players[store.current] ? store.players[store.current] : null; }
function totalOf(p) { return Object.values(p.done || {}).reduce((s, d) => s + (d.score || 0), 0); }
function addPlayer(name) {
  name = name.trim();
  if (!name) return false;
  if (!store.players[name]) store.players[name] = { done: {}, level: 1 };
  store.current = name; saveStore();
  return true;
}
function renderPlayer() {
  const p = currentPlayer();
  $("playerName").textContent = store.current || "—";
  $("playerTotal").textContent = p ? totalOf(p) : 0;
}
function renderRanks() {
  // 依加入順序列出，不排名
  const rows = Object.entries(store.players)
    .map(([name, p]) => ({ name, total: totalOf(p), cleared: Object.keys(p.done || {}).length }));
  $("ranks").innerHTML = rows.length
    ? `<tr><th>參賽者</th><th class="num">過關</th><th class="num">積分</th><th></th></tr>` +
      rows.map(r => `<tr data-name="${r.name.replace(/"/g, "&quot;")}" class="${r.name === store.current ? "me" : ""}">
        <td>${r.name.replace(/</g, "&lt;")}</td><td class="num">${r.cleared}</td><td class="num">${r.total}</td>
        <td><button class="del" title="刪除">✕</button></td></tr>`).join("")
    : `<tr><td class="hint">還沒有參賽者，請先加入一位</td></tr>`;
  $("btnClose").disabled = !currentPlayer();
}
function openBoard() { renderRanks(); $("modal").hidden = false; if (!currentPlayer()) $("newName").focus(); }
function closeBoard() { if (currentPlayer()) $("modal").hidden = true; }

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function startTimer() {
  if (timerId || won || lost) return;
  startTime = Date.now() - elapsed;
  timerId = setInterval(() => { elapsed = Date.now() - startTime; timerEl.textContent = fmt(elapsed); }, 250);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

function loadLevel(lv) {
  level = Math.max(1, lv);
  const p = currentPlayer();
  if (p) { p.level = level; saveStore(); }
  $("overlay").hidden = false;
  // 讓「產生關卡中…」先畫出來再開始算
  setTimeout(() => {
    puzzle = generateLevel(level);
    marks = Array.from({ length: puzzle.n }, () => new Array(puzzle.n).fill(EMPTY));
    won = lost = false; mistakes = 0; stopTimer(); elapsed = 0; timerEl.textContent = "0:00";
    $("levelNum").textContent = level;
    $("levelInfo").textContent = `${TIER_NAME[puzzle.tier]} · ${puzzle.n}×${puzzle.n}`;
    $("gotoLevel").value = level;
    buildBoard();
    render();
    $("overlay").hidden = true;
  }, 20);
}

function buildBoard() {
  const n = puzzle.n;
  // minmax(0, 1fr)：欄寬列高都平均分配，內容（叉叉、貓）不會把格子撐大
  boardEl.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
  boardEl.style.gridTemplateRows = `repeat(${n}, minmax(0, 1fr))`;
  boardEl.innerHTML = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const d = document.createElement("div");
    d.className = "cell";
    d.style.background = puzzle.colors[puzzle.region[r][c]];
    d.style.setProperty("--tile", puzzle.colors[puzzle.region[r][c]]);
    d.dataset.r = r; d.dataset.c = c;
    d.innerHTML = '<span class="mark"></span>';
    boardEl.appendChild(d);
  }
}

// 點一下：切換叉叉（空 ↔ 叉）；連點兩下：放貓。
// 放對的貓與放錯的格子都會鎖定，之後點了沒有反應。
let lastTap = { key: -1, time: 0 };
let suppressClick = false;   // 剛完成一次拖曳時，忽略隨後的 click
boardEl.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; return; }
  if (!currentPlayer()) { openBoard(); return; }
  const cell = e.target.closest(".cell");
  if (!cell || won || lost) return;
  const r = +cell.dataset.r, c = +cell.dataset.c, key = r * puzzle.n + c, now = Date.now();
  if (marks[r][c] === CAT || marks[r][c] === WRONG) return;
  if (lastTap.key === key && now - lastTap.time < 350) {
    lastTap = { key: -1, time: 0 };
    if (puzzle.solution[r] === c) {                                        // 放對：鎖定，貓叫 + 稱讚
      marks[r][c] = CAT;
      const found = marks.flat().filter(m => m === CAT).length;
      sfx.found(found === puzzle.n);
    }
    else { marks[r][c] = WRONG; mistakes++; sfx.wrong(); }              // 放錯：紅色錯誤並鎖定
  } else {
    marks[r][c] = marks[r][c] === EMPTY ? MARK_X : EMPTY;
    sfx.click();
    lastTap = { key, time: now };
  }
  startTimer();
  render();
});

// 拖曳：手指滑過的格子全部標叉；從已有叉的格子開始滑則是清除叉
let drag = null;
function cellAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest(".cell");
  return cell && boardEl.contains(cell) ? cell : null;
}
function dragApply(cell) {
  const r = +cell.dataset.r, c = +cell.dataset.c;
  if (marks[r][c] === EMPTY || marks[r][c] === MARK_X) marks[r][c] = drag.mode;
}
boardEl.addEventListener("pointerdown", e => {
  const cell = e.target.closest(".cell");
  if (!cell || won || lost || !currentPlayer()) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  drag = { start: cell, last: cell, active: false, mode: marks[r][c] === MARK_X ? EMPTY : MARK_X };
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell || cell === drag.last) return;
  if (!drag.active) { drag.active = true; dragApply(drag.start); }   // 離開起點才算拖曳
  dragApply(cell);
  sfx.click();
  drag.last = cell;
  startTimer();
  render();
});
function dragEnd() {
  if (drag && drag.active) { suppressClick = true; lastTap = { key: -1, time: 0 }; }
  drag = null;
}
window.addEventListener("pointerup", dragEnd);
window.addEventListener("pointercancel", dragEnd);

// 自動標叉：被任何一隻貓「攻擊」到的空格
function autoMarked() {
  const n = puzzle.n, set = new Set();
  if (!$("autoMark").checked) return set;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (marks[r][c] === CAT) {
    for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++) {
      if (marks[rr][cc] !== EMPTY) continue;
      if (rr === r || cc === c || puzzle.region[rr][cc] === puzzle.region[r][c] ||
          (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1)) set.add(rr * n + cc);
    }
  }
  return set;
}

// 貓的剪影：頭、耳朵、白色眼睛鼻子鬍鬚，主體填上區域顏色
function catSvg(color) {
  const delay = -(Math.random() * 5).toFixed(2);   // 每隻貓的眼睛動作不同步
  return `<svg viewBox="0 0 100 100" aria-hidden="true" class="cat">
    <path fill="${color}" d="M16 46 L10 8 L38 26 Q50 22 62 26 L90 8 L84 46 Q94 58 92 72 Q86 96 50 96 Q14 96 8 72 Q6 58 16 46 Z"/>
    <g class="eyes" style="animation-delay:${delay}s">
      <ellipse cx="35" cy="60" rx="7" ry="9" fill="#fff"/><ellipse cx="65" cy="60" rx="7" ry="9" fill="#fff"/>
      <g class="pupils" style="animation-delay:${delay}s">
        <ellipse cx="35" cy="61" rx="3.2" ry="6" fill="#222"/><ellipse cx="65" cy="61" rx="3.2" ry="6" fill="#222"/>
      </g>
    </g>
    <path fill="#fff" d="M44 73 L56 73 L50 80 Z"/>
    <path stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"
      d="M50 80 Q50 86 42 87 M50 80 Q50 86 58 87 M8 68 L30 72 M8 80 L30 78 M92 68 L70 72 M92 80 L70 78"/>
  </svg>`;
}

function renderLives() {
  $("lives").innerHTML = Array.from({ length: MAX_MISTAKES }, (_, i) =>
    `<span class="${i < mistakes ? "lost" : ""}">${i < mistakes ? "😿" : "🐱"}</span>`).join("");
}

function render() {
  const n = puzzle.n;
  const auto = autoMarked();
  let cats = 0;
  for (const cell of boardEl.children) {
    const r = +cell.dataset.r, c = +cell.dataset.c, m = marks[r][c], key = r * n + c;
    const span = cell.firstChild;
    span.className = "mark";
    span.textContent = "";
    cell.classList.toggle("hascat", m === CAT);
    if (m === CAT) { span.innerHTML = catSvg(puzzle.colors[puzzle.region[r][c]]); span.className = "mark cat"; cats++; }
    else if (m === WRONG || m === MARK_X) span.className = "mark x";
    else if (auto.has(key)) span.className = "mark x auto";
    cell.classList.toggle("wrong", m === WRONG);
    cell.classList.toggle("locked", m === CAT || m === WRONG);
  }
  renderLives();
  if (cats === n) {
    won = true; stopTimer(); sfx.win();
    boardEl.classList.add("won");
    statusEl.className = "status win";
    const score = calcScore(puzzle.tier, mistakes, elapsed);
    const p = currentPlayer();
    let msg = `🎉 過關！用時 ${fmt(elapsed)}，得 ${score} 分`;
    if (p) {
      const prev = p.done[level];
      if (!prev || score > prev.score) { p.done[level] = { score, time: elapsed, mistakes }; msg += prev ? "，刷新本關最高分！" : ""; }
      else msg += `（本關最高 ${prev.score} 分）`;
      saveStore(); renderPlayer();
    }
    statusEl.textContent = msg;
  } else if (mistakes >= MAX_MISTAKES) {
    lost = true; stopTimer(); sfx.lose();
    boardEl.classList.add("won");
    statusEl.className = "status lose";
    statusEl.textContent = `😿 錯了 ${MAX_MISTAKES} 次，挑戰失敗，按「重來」再試`;
  } else {
    boardEl.classList.remove("won");
    statusEl.className = "status";
    statusEl.textContent = `已找到 ${cats} / ${n} 隻貓` + (mistakes ? `，錯 ${mistakes} 次` : "");
  }
  updateProgressInfo();
}

function updateProgressInfo() {
  const p = currentPlayer();
  const done = p ? Object.keys(p.done).length : 0;
  const best = p ? p.done[level] : null;
  $("progressInfo").textContent =
    `已完成 ${done} 關。` + (best ? `本關最高 ${best.score} 分（${fmt(best.time)}）。` : "") +
    ` 本關 ${TIER_NAME[puzzle.tier]} ${puzzle.n}×${puzzle.n}，產生器嘗試 ${puzzle.attempts} 次找到符合難度的唯一解。`;
}

$("btnPrev").onclick = () => { if (level > 1) loadLevel(level - 1); };
$("btnNext").onclick = () => loadLevel(level + 1);
$("btnReset").onclick = () => { marks.forEach(row => row.fill(EMPTY)); won = lost = false; mistakes = 0; stopTimer(); elapsed = 0; timerEl.textContent = "0:00"; render(); };
$("btnSettings").onclick = () => { $("settings").hidden = !$("settings").hidden; };
$("btnGoto").onclick = () => loadLevel(+$("gotoLevel").value || 1);
$("autoMark").onchange = () => { store.autoMark = $("autoMark").checked; saveStore(); render(); };
$("sound").onchange = () => { store.sound = $("sound").checked; saveStore(); if (store.sound) sfx.click(); };
$("meowPick").onchange = () => { store.meow = +$("meowPick").value; saveStore(); $("btnMeowTest").click(); };
$("btnMeowTest").onclick = async () => {
  const wasOff = !$("sound").checked;
  if (wasOff) $("sound").checked = true;          // 試聽時暫時開聲音
  const c = audio();
  if (c) { if (!chosenMeow()) { await loadMeows(c); await new Promise(r => setTimeout(r, 300)); } playMeow(c); }
  if (wasOff) $("sound").checked = false;
};
$("btnClear").onclick = () => { if (confirm("確定清除所有參賽者與進度？")) { store = { players: {} }; saveStore(); renderPlayer(); $("settings").hidden = true; openBoard(); } };

$("btnBoard").onclick = openBoard;
$("btnClose").onclick = closeBoard;
$("btnAdd").onclick = () => {
  if (!addPlayer($("newName").value)) return;
  $("newName").value = "";
  renderPlayer(); renderRanks();
  loadLevel(currentPlayer().level);
};
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") $("btnAdd").click(); });
$("ranks").addEventListener("click", e => {
  const row = e.target.closest("tr[data-name]");
  if (!row) return;
  const name = row.dataset.name;
  if (e.target.closest(".del")) {
    if (!confirm(`刪除參賽者「${name}」與其成績？`)) return;
    delete store.players[name];
    if (store.current === name) store.current = Object.keys(store.players)[0] || null;
    saveStore(); renderPlayer(); renderRanks();
    if (currentPlayer()) loadLevel(currentPlayer().level);
    return;
  }
  if (name !== store.current) { store.current = name; saveStore(); renderPlayer(); renderRanks(); loadLevel(currentPlayer().level); }
});

if (store.autoMark === false) $("autoMark").checked = false;
if (store.sound === false) $("sound").checked = false;
$("meowPick").value = String(store.meow ?? 0);
renderPlayer();
if (currentPlayer()) loadLevel(currentPlayer().level);
else { loadLevel(1); openBoard(); }
</script>
</body>
</html>
